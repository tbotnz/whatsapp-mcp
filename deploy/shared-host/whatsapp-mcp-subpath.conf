# nginx locations that serve the WhatsApp MCP server under a sub-path of an
# existing site, e.g. https://example.com/whatsapp, when a dedicated hostname
# is not available. Include this file inside the site's HTTPS server block and
# set WHATSAPP_MCP_PUBLIC_URL=https://example.com/whatsapp. To use another
# prefix, replace "whatsapp" in the three location lines and the first rewrite.
#
# No add_header here on purpose: nginx would then drop the server-level
# security headers.
#
# The upstream is a variable resolved through Docker's DNS per request, so
# nginx starts and the site keeps working even when the WhatsApp stack is
# down (these paths then answer 502).

# Everything the server serves at its root: /mcp, /authorize, /token,
# /register, /revoke, /consent, /health. The /whatsapp prefix is stripped.
location ^~ /whatsapp/ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $whatsapp_mcp http://whatsapp-mcp:8000;
    rewrite ^/whatsapp/(.*)$ /$1 break;
    proxy_pass $whatsapp_mcp;
    proxy_http_version 1.1;
    # Must stay the public hostname: the server rejects other Host values.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    # MCP responses can be SSE streams.
    proxy_buffering off;
    proxy_cache off;
    proxy_request_buffering off;
    proxy_read_timeout 660s;
    proxy_send_timeout 660s;
    client_max_body_size 4m;
}

# OAuth discovery for a server that lives under a path (RFC 9728 / RFC 8414):
# clients insert the well-known segment before the path. These are longer
# prefixes than the site's own /.well-known/oauth-* locations, so they win
# for the /whatsapp suffix only and leave the site's own documents alone.
location ^~ /.well-known/oauth-protected-resource/whatsapp {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $whatsapp_mcp http://whatsapp-mcp:8000;
    proxy_pass $whatsapp_mcp;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ^~ /.well-known/oauth-authorization-server/whatsapp {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $whatsapp_mcp http://whatsapp-mcp:8000;
    rewrite ^ /.well-known/oauth-authorization-server break;
    proxy_pass $whatsapp_mcp;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}
