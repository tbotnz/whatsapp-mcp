# nginx server blocks for an existing nginx container on the same host:
# forward one hostname to the WhatsApp MCP server running in its own compose
# stack (see ../../docker-compose.vps.yml). Replace whatsapp.example.com
# throughout, and adjust the certificate, ACME webroot and TLS-options paths
# to match your nginx setup.
#
# Add this file to the proxy (e.g. as /etc/nginx/conf.d/whatsapp-mcp.conf)
# AFTER the certificate exists: nginx refuses to start when an
# ssl_certificate file is missing, which would take its other sites down too.

# HTTP: ACME challenges, everything else to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name whatsapp.example.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name whatsapp.example.com;

    ssl_certificate     /etc/letsencrypt/live/whatsapp.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/whatsapp.example.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/whatsapp.example.com/chain.pem;
    # Your shared TLS settings (protocols, ciphers), if you keep them in a file:
    # include /etc/nginx/options-ssl.conf;

    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Resolve the upstream per request through Docker's DNS instead of at
    # start-up. With a literal proxy_pass host, nginx would fail to start (and
    # take its other sites down) whenever the WhatsApp stack is stopped; this
    # way it starts regardless and answers 502 until the stack is back.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $whatsapp_mcp http://whatsapp-mcp:8000;

    # Everything on this hostname belongs to the MCP server: /mcp, the OAuth
    # endpoints and discovery documents, the approval page and /health.
    location / {
        proxy_pass $whatsapp_mcp;
        proxy_http_version 1.1;
        # Must stay the public hostname: the server rejects other Host values.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # MCP responses can be SSE streams.
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        proxy_read_timeout 660s;
        proxy_send_timeout 660s;
        client_max_body_size 4m;
    }
}
